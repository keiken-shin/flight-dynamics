THESIS: One idea per numbered plate, taken apart with your hands. Refuses the course-platform
arrangement — no hero, no card grid of lessons, no progress ring; the exploded drawing is the
navigation and the reader's own hands are the interface.
OWN-WORLD: Aircraft maintenance manual / illustrated parts catalogue. Index stock #F4F4F1,
ink #14171C, ONE accent (chart magenta #D6006E, borrowed from sectional airspace rings and
absent from the semantic set). Square corners, hairline plates, three line weights, zero
elevation. Archivo caps for chrome, JetBrains Mono for measurement. Chrome spends no colour,
so lift-blue, thrust-green and drag-red are the only colour on the page.
STORY: The reader understands that four forces explain everything an aircraft does, believes
the wrong model they arrived with is genuinely wrong, and pushes a throttle until the aircraft
they just read about leaves the ground.
FIRST VIEWPORT: Ruled zone-grid margin; a sticky rule-bottomed bar with the plate title left and
chapter right; a display line and a short lede at 46/54; then a full-bleed exploded isometric
aircraft with twelve numbered balloons on leader lines that draw themselves in. Primary action
is the balloon itself. A twelve-row index table sits under the plate.
FORM: Illustrated Parts Catalogue, candidate 4 of the grounded list, seed key 367d4bdc.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
